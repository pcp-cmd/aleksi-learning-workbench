name: Build optimized Windows installer

on:
  push:
    branches:
      - actions/build-optimized-0.1.5-rc.1-20260830
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: optimized-windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-installer:
    name: Build optimized NSIS installer
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      ALEKSI_RELEASE_SIGNING_POLICY: unsigned-preview

    steps:
      - name: Check out build branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Materialize uploaded optimized feature source
        shell: pwsh
        run: |
          $payloadDir = ".github/build-payload/optimized-feature-overlay"
          $base64 = ((Get-ChildItem "$payloadDir/chunk-*.txt" | Sort-Object Name | ForEach-Object { Get-Content $_.FullName -Raw }) -join "")
          $archive = Join-Path $env:RUNNER_TEMP "aleksi-optimized-feature-overlay.tar.gz"
          [IO.File]::WriteAllBytes($archive, [Convert]::FromBase64String($base64))

          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne "6276c55a5cc4cecb22e4598bc3029e9f264699ae6a18749195117be9faea533a") {
            throw "Optimized source payload checksum mismatch: $hash"
          }

          tar -xzf $archive -C .

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features
          git rm -r -- "$payloadDir"
          git rm -- ".github/workflows/build-optimized-upload.yml"
          git commit -m "build: materialize optimized source snapshot"

          if (git status --porcelain) {
            throw "Build source is not clean after materialization."
          }

      - name: Set up pinned Node 22.23.1
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up pinned Rust 1.97.1
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: "1.97.1"
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with:
          workspaces: "src-tauri -> target"

      - name: Install locked dependencies
        shell: pwsh
        run: npm.cmd ci --ignore-scripts

      - name: Verify canonical release identity
        shell: pwsh
        run: node scripts/verify-release-identity.mjs

      - name: Build canonical NSIS installer
        shell: pwsh
        run: |
          $env:ALEKSI_NODE_RUNTIME_PATH = (Get-Command node.exe).Source
          npm.cmd run package:desktop

      - name: Verify installer and release manifest
        shell: pwsh
        run: |
          npm.cmd run verify:desktop
          npm.cmd run verify:release-manifest

      - name: Resolve release artifact
        id: release
        shell: pwsh
        run: |
          $identity = Get-Content "release/identity.json" -Raw | ConvertFrom-Json
          "release_dir=$($identity.releaseDirectory)" >> $env:GITHUB_OUTPUT
          "artifact_name=aleksi-workbench-$($identity.version)-optimized-windows-installer" >> $env:GITHUB_OUTPUT
          "### Windows installer" >> $env:GITHUB_STEP_SUMMARY
          "- Version: $($identity.version)" >> $env:GITHUB_STEP_SUMMARY
          "- Installer: $($identity.installerFilename)" >> $env:GITHUB_STEP_SUMMARY
          "- Signing policy: unsigned-preview" >> $env:GITHUB_STEP_SUMMARY

      - name: Upload installer package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.release.outputs.artifact_name }}
          path: ${{ steps.release.outputs.release_dir }}
          if-no-files-found: error
          retention-days: 14
