name: AE26 LinkFix Windows installer

on:
  push:
    branches: [main]
    paths:
      - "src/features/reader/**"
      - "tests/ui/document-reader.test.tsx"
      - "tests/ui/reading-links.test.ts"
      - ".github/workflows/ae26-linkfix-installer.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ae26-linkfix-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build AE26 LinkFix installer
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      ALEKSI_RELEASE_SIGNING_POLICY: unsigned-preview

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pinned Node 22.23.1
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Rust MSVC toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 2026-07-28
        with:
          toolchain: "1.97.1"
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Cache Cargo build data
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: src-tauri -> target

      - name: Install locked npm dependencies
        shell: pwsh
        run: npm.cmd ci --ignore-scripts

      - name: Typecheck LinkFix source
        shell: pwsh
        run: npm.cmd run typecheck

      - name: Run LinkFix tests
        shell: pwsh
        run: npm.cmd test -- --run tests/ui/reading-links.test.ts tests/ui/document-reader.test.tsx

      - name: Build canonical NSIS installer
        shell: pwsh
        run: |
          $env:ALEKSI_NODE_RUNTIME_PATH = (Get-Command node.exe).Source
          npm.cmd run package:desktop

      - name: Verify installer exists
        shell: pwsh
        run: |
          $installer = 'artifacts/release/aleksi-workbench/0.1.5-rc.1/Aleksi-Workbench-0.1.5-rc.1-Setup.exe'
          if (-not (Test-Path -LiteralPath $installer)) {
            throw "Installer not produced: $installer"
          }
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "## AE26 LinkFix installer" >> $env:GITHUB_STEP_SUMMARY
          "- Installer: $installer" >> $env:GITHUB_STEP_SUMMARY
          "- SHA-256: $hash" >> $env:GITHUB_STEP_SUMMARY

      - name: Upload installer artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aleksi-workbench-0.1.5-rc.1-ae26-linkfix-windows
          path: artifacts/release/aleksi-workbench/0.1.5-rc.1
          if-no-files-found: error
          retention-days: 30
