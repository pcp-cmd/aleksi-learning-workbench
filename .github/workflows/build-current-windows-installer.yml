name: Build current Windows installer

on:
  workflow_run:
    workflows: ["Source CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-windows-installer-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  build-and-qualify:
    name: Build and qualify current Windows installer
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    uses: ./.github/workflows/windows-qualification.yml
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
