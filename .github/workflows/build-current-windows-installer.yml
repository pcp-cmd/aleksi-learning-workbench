name: Canonical Windows qualification and installer build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-windows-installer-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build-and-qualify:
    name: Build and qualify current Windows installer
    uses: ./.github/workflows/windows-qualification.yml
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write

  publish-build-handoff:
    name: Publish build handoff metadata
    needs: build-and-qualify
    if: always() && needs.build-and-qualify.result != 'skipped'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_RESULT: ${{ needs.build-and-qualify.result }}
    steps:
      - name: Record the workflow run ID and result
        shell: bash
        run: |
          set -euo pipefail
          title="Latest Windows installer build"
          body=$(cat <<EOF
          The current Windows installer workflow finished.

          - Result: ${BUILD_RESULT}
          - Workflow run ID: ${GITHUB_RUN_ID}
          - Commit: ${GITHUB_SHA}
          - Workflow: ${GITHUB_WORKFLOW}

          On success, the installer and qualification evidence are stored in this run's GitHub Actions artifacts. On failure, inspect this run's failed job logs before changing source code.
          EOF
          )
          issue_number=$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --search "$title in:title" \
            --json number,title \
            --jq '.[] | select(.title == "Latest Windows installer build") | .number' \
            | head -n 1)
          if [ -n "$issue_number" ]; then
            gh issue edit "$issue_number" \
              --repo "$GITHUB_REPOSITORY" \
              --body "$body"
          else
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --body "$body"
          fi
