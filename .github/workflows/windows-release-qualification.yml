name: Windows release qualification

on:
  workflow_dispatch:
    inputs:
      predecessor_installer_url:
        description: "Authenticated or public URL for the canonical 0.1.2 installer"
        required: true
        type: string
  pull_request:
    paths:
      - ".github/workflows/windows-release-qualification.yml"
      - "release/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/**"
      - "server/**"
      - "shared/**"
      - "src/**"
      - "src-tauri/**"
      - "tests/**"

permissions:
  contents: read

concurrency:
  group: windows-release-qualification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify-unsigned-windows-installer:
    name: Qualify unsigned Windows installer
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      ALEKSI_RELEASE_SIGNING_POLICY: unsigned-preview

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pinned Node 22.23.1
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up pinned npm 12.0.1 audit client
        shell: pwsh
        run: |
          npm.cmd install --global npm@12.0.1 --ignore-scripts
          $actualVersion = (npm.cmd --version).Trim()
          if ($actualVersion -ne '12.0.1') {
            throw "Expected npm 12.0.1, found $actualVersion."
          }

      - name: Set up Rust MSVC toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Cache Cargo build data
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install locked npm dependencies
        shell: pwsh
        run: npm.cmd ci --ignore-scripts

      - name: Verify canonical release identity
        shell: pwsh
        run: node scripts/verify-release-identity.mjs

      - name: Audit npm dependencies
        shell: pwsh
        run: npm.cmd audit --audit-level=high

      - name: Typecheck
        shell: pwsh
        run: npm.cmd run typecheck

      - name: Run unit API and UI tests
        shell: pwsh
        run: npm.cmd run test

      - name: Install Chromium for production browser checks
        shell: pwsh
        run: npm.cmd exec -- playwright install chromium

      - name: Run production browser tests
        shell: pwsh
        run: npm.cmd run test:browser:production

      - name: Prepare deterministic desktop resources
        shell: pwsh
        run: |
          $env:ALEKSI_NODE_RUNTIME_PATH = (Get-Command node.exe).Source
          npm.cmd run prepare:desktop

      - name: Check Rust formatting
        shell: pwsh
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Check Rust compilation
        shell: pwsh
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked

      - name: Run Rust clippy
        shell: pwsh
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings

      - name: Run Rust tests
        shell: pwsh
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Verify packaged sidecar
        shell: pwsh
        run: npm.cmd run verify:packaged-sidecar

      - name: Package canonical NSIS installer
        shell: pwsh
        run: |
          $env:ALEKSI_NODE_RUNTIME_PATH = (Get-Command node.exe).Source
          npm.cmd run package:desktop

      # Future signing insertion point: after package creation and before the
      # final hash verification. This unsigned workflow references no signing
      # credential and must not be repurposed without separate approval.
      - name: Validate unsigned signing boundary and resolve artifact paths
        id: release
        shell: pwsh
        run: |
          $identity = Get-Content -LiteralPath 'release/identity.json' -Raw | ConvertFrom-Json
          if ($identity.signing.status -ne $env:ALEKSI_RELEASE_SIGNING_POLICY) {
            throw "Expected unsigned-preview signing policy, found $($identity.signing.status)"
          }
          if ($identity.signing.metadataOnly -ne $true) {
            throw 'Unsigned qualification requires metadataOnly signing state'
          }
          "release_dir=$($identity.releaseDirectory)" >> $env:GITHUB_OUTPUT
          "manifest_path=$($identity.releaseDirectory)/release-manifest.json" >> $env:GITHUB_OUTPUT
          "artifact_name=$($identity.releaseSlug)-$($identity.version)-windows-unsigned" >> $env:GITHUB_OUTPUT

      - name: Verify canonical desktop installer
        shell: pwsh
        run: npm.cmd run verify:desktop

      - name: Download and install canonical predecessor
        if: github.event_name == 'workflow_dispatch'
        id: predecessor
        shell: pwsh
        env:
          PREDECESSOR_INSTALLER_URL: ${{ inputs.predecessor_installer_url }}
        run: |
          $identity = Get-Content -LiteralPath 'release/identity.json' -Raw | ConvertFrom-Json
          $destination = Join-Path $env:RUNNER_TEMP $identity.upgradeFrom.installerFilename
          Invoke-WebRequest -Uri $env:PREDECESSOR_INSTALLER_URL -OutFile $destination
          $actualHash = (Get-FileHash -LiteralPath $destination -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $identity.upgradeFrom.installerSha256) {
            throw "Predecessor installer SHA-256 mismatch: $actualHash"
          }
          $install = Start-Process -FilePath $destination -ArgumentList @('/S') -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            throw "Predecessor silent install failed with exit code $($install.ExitCode)"
          }
          "installer_path=$destination" >> $env:GITHUB_OUTPUT

      - name: Verify installed upgrade and native close lifecycle
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path 'artifacts/qualification' -Force | Out-Null
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/verify-installed-desktop.ps1 `
            -InstallerPath (Join-Path '${{ steps.release.outputs.release_dir }}' (Get-Content 'release/identity.json' -Raw | ConvertFrom-Json).installerFilename) `
            -ManifestPath '${{ steps.release.outputs.manifest_path }}' `
            -PredecessorInstallerPath '${{ steps.predecessor.outputs.installer_path }}' `
            -EvidencePath 'artifacts/qualification/installed-desktop-evidence.json'

      - name: Capture installed lifecycle diagnostics
        if: always() && github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path 'artifacts/qualification' -Force | Out-Null
          $logRoot = Join-Path $env:LOCALAPPDATA 'io.aleksi.workbench\logs'
          if (Test-Path -LiteralPath $logRoot) {
            Copy-Item -LiteralPath $logRoot -Destination 'artifacts/qualification/runtime-logs' -Recurse -Force
          }

      - name: Uninstall runner qualification payload
        if: always() && github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Aleksi Workbench'
          if (Test-Path -LiteralPath $key) {
            $command = ([string](Get-ItemProperty -LiteralPath $key).UninstallString).Trim().Trim('"')
            $uninstall = Start-Process -FilePath $command -ArgumentList @('/S') -Wait -PassThru
            if ($uninstall.ExitCode -ne 0) {
              throw "Qualification cleanup uninstall failed with exit code $($uninstall.ExitCode)"
            }
          }
          if (Test-Path -LiteralPath $key) {
            throw 'Qualification cleanup left the uninstall registry key behind.'
          }
          $remaining = @(Get-Process -Name 'aleksi-workbench', 'node' -ErrorAction SilentlyContinue |
            Where-Object { $_.Path -like "$env:LOCALAPPDATA\Aleksi Workbench\*" })
          if ($remaining.Count -ne 0) {
            throw "Qualification cleanup left $($remaining.Count) installed payload processes running."
          }

      - name: Record qualification summary
        shell: pwsh
        run: |
          $manifest = Get-Content -LiteralPath '${{ steps.release.outputs.manifest_path }}' -Raw | ConvertFrom-Json
          $installer = Join-Path '${{ steps.release.outputs.release_dir }}' $manifest.installer.path
          $actualHash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $manifest.installer.sha256) {
            throw "Installer SHA-256 mismatch: $actualHash"
          }
          "## Aleksi Workbench Windows qualification" >> $env:GITHUB_STEP_SUMMARY
          "- Version: $($manifest.version)" >> $env:GITHUB_STEP_SUMMARY
          "- Build: $($manifest.buildId)" >> $env:GITHUB_STEP_SUMMARY
          "- Installer: $installer" >> $env:GITHUB_STEP_SUMMARY
          "- SHA-256: $actualHash" >> $env:GITHUB_STEP_SUMMARY
          "- Signing: unsigned-preview" >> $env:GITHUB_STEP_SUMMARY
          "- Boundary: artifact uploaded only; no GitHub Release was created." >> $env:GITHUB_STEP_SUMMARY

      - name: Upload qualified installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.release.outputs.artifact_name }}
          path: ${{ steps.release.outputs.release_dir }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload installed lifecycle evidence
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.release.outputs.artifact_name }}-installed-lifecycle
          path: artifacts/qualification
          if-no-files-found: error
          retention-days: 14
