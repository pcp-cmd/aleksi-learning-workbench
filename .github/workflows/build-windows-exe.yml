name: Build Windows EXE

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aleksi-workbench-windows-build
  cancel-in-progress: false

jobs:
  build-windows-installer:
    name: Build NSIS installer
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out build repository
        uses: actions/checkout@v4

      - name: Verify and extract source archive
        shell: pwsh
        run: |
          $archive = Join-Path $env:GITHUB_WORKSPACE "source/Aleksi-Learning-Workbench-Source-Upload.zip"
          $workbench = Join-Path $env:GITHUB_WORKSPACE "workbench"
          $expectedHash = "3edfff7e2ddeb34e225c80ed399c23d167a8bd85c970ba51e747dc3c8714b9f2"

          if (-not (Test-Path $archive)) {
            throw "Source archive was not found at $archive."
          }

          $actualHash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw "Source archive integrity check failed. Expected $expectedHash, got $actualHash."
          }

          if (Test-Path $workbench) {
            Remove-Item $workbench -Recurse -Force
          }
          New-Item -ItemType Directory -Path $workbench -Force | Out-Null
          Expand-Archive -LiteralPath $archive -DestinationPath $workbench -Force

          $requiredFiles = @(
            "package.json",
            "package-lock.json",
            "src-tauri/tauri.conf.json",
            "src-tauri/Cargo.toml",
            "scripts/prepare-desktop.mjs"
          )
          foreach ($required in $requiredFiles) {
            $candidate = Join-Path $workbench $required
            if (-not (Test-Path $candidate)) {
              throw "The extracted source package is incomplete: missing $required."
            }
          }

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workbench/package-lock.json

      - name: Set up Rust stable MSVC
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Rust build dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: workbench/src-tauri -> target

      - name: Install JavaScript dependencies
        working-directory: workbench
        run: npm ci

      - name: Verify changed frontend surfaces
        working-directory: workbench
        run: |
          npm run typecheck
          npx vitest run tests/ui/card-diagnosis.test.tsx tests/ui/today-settings.test.tsx --reporter=default --testTimeout=15000 --hookTimeout=15000

      - name: Build Windows NSIS installer
        working-directory: workbench
        run: npm run build:desktop

      - name: Collect installer
        shell: pwsh
        run: |
          $bundle = Join-Path $env:GITHUB_WORKSPACE "workbench/src-tauri/target/release/bundle/nsis"
          $output = Join-Path $env:GITHUB_WORKSPACE "windows-installer"
          New-Item -ItemType Directory -Path $output -Force | Out-Null
          $installers = Get-ChildItem -Path $bundle -Filter "*.exe" -File
          if ($installers.Count -eq 0) {
            throw "Tauri did not produce an NSIS installer."
          }
          foreach ($installer in $installers) {
            Copy-Item $installer.FullName -Destination $output -Force
          }
          Get-FileHash (Join-Path $output "*.exe") -Algorithm SHA256 |
            Format-Table -AutoSize |
            Out-String |
            Set-Content (Join-Path $output "SHA256.txt") -Encoding utf8

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Aleksi-Workbench-Windows-Installer
          path: windows-installer/*
          if-no-files-found: error
          retention-days: 3
