name: Source CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: source-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-quality:
    name: Source, browser, and supply-chain gates
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pinned Node 22.23.1
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Verify canonical release identity
        run: node scripts/verify-release-identity.mjs

      - name: Audit locked npm dependencies
        run: npm run audit:release

      - name: Typecheck
        run: npm run typecheck

      - name: Enforce lint and architecture boundaries
        run: |
          npm run lint
          npm run architecture

      - name: Run source security scan
        run: npm run scan:source-security

      - name: Run Vitest
        run: npm run test -- --maxWorkers=1

      - name: Profile unified Markdown document pipeline
        run: npm run profile:documents

      - name: Install Chromium for production browser checks
        run: npm exec -- playwright install --with-deps chromium

      - name: Run production browser checks
        run: npm run test:browser:production

      - name: Package and audit the exact source candidate
        run: |
          npm run package:desktop-source
          npm run audit:desktop-source

      - name: Upload audited source candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aleksi-workbench-source-${{ github.sha }}
          path: artifacts/Aleksi-Learning-Workbench-Source-0.1.5-rc.1.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload document performance evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: document-performance-${{ github.sha }}
          path: artifacts/performance/large-document-profile.json
          if-no-files-found: error
          retention-days: 14
