name: Apply ReaderPage lint fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-reader-lint.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Stabilize readingList hook dependency
        shell: bash
        run: >-
          python -c "from pathlib import Path; p=Path('src/features/reader/ReaderPage.tsx'); s=p.read_text(encoding='utf-8'); old='  const readingList = readings.data?.readings ?? [];\\n  const {\\n    activateBasketCard,\\n'; new='  const readingList = useMemo(\\n    () => readings.data?.readings ?? [],\\n    [readings.data?.readings]\\n  );\\n  const {\\n    activateBasketCard,\\n'; assert s.count(old)==1, s.count(old); p.write_text(s.replace(old,new,1), encoding='utf-8')"
      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name "pcp-cmd"
          git config user.email "Qwe2318738496@outlook.com"
          git rm .github/workflows/fix-reader-lint.yml
          git add src/features/reader/ReaderPage.tsx
          git commit -m "Stabilize ReaderPage reading list memoization"
          git push origin HEAD:main
