[package]
name = "aleksi-workbench"
version = "0.1.1"
description = "Local-first Aleksi learning workbench desktop shell"
authors = ["Aleksi Workbench"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "aleksi_workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
